<!doctype html>
<html lang="en" class="scroll-smooth" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout · Mine Orange Store</title>
  <meta name="description" content="Complete your purchase on the official Mine Orange Network Store.">
  <link rel="icon" href="uploads/logo.png?v=transparent">

  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js CDN -->
  <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: ['selector', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            accent: '#FF2200',
            'accent-hover': '#ff3d1f'
          },
          fontFamily: {
            sans: ['Poppins', 'ui-sans-serif', 'system-ui'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
            display: ['Poppins', 'ui-sans-serif'],
          }
        }
      }
    };
  </script>

  <!-- Battlepie Core Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen font-sans antialiased" x-data="checkoutPage()" x-init="init()">

  <!-- ==================== TOP NAVIGATION ==================== -->
  <nav x-data="{ mobileOpen: false }" class="sticky top-0 z-40 glass border-b border-white/5">
    <div class="max-w-7xl mx-auto px-3 sm:px-4 h-16 grid grid-cols-[auto,1fr,auto] md:grid-cols-[1fr,auto,1fr] items-center gap-2 sm:gap-4">
      
      <!-- Brand & Mobile Toggle -->
      <div class="flex items-center gap-1.5 min-w-0 justify-self-start">
        <button type="button"
                class="md:hidden w-9 h-9 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-center text-white/70 hover:text-white transition flex-shrink-0"
                aria-label="Open menu"
                @click="mobileOpen = !mobileOpen">
          <svg x-show="!mobileOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
          <svg x-show="mobileOpen" x-cloak width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
        <a href="index.html" class="flex items-center gap-2 sm:gap-2.5 font-display font-bold text-base sm:text-lg min-w-0">
          <img src="uploads/logo.png?v=transparent" alt="Mine Orange" class="w-8 h-8 object-contain flex-shrink-0">
          <span class="truncate tracking-tight">Mine Orange</span>
        </a>
      </div>

      <!-- Center Desktop Nav Links -->
      <div class="hidden md:flex items-center gap-1.5 text-sm text-white/70 justify-self-center">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="store.html">Store</a>
        <a class="nav-link text-white font-semibold" href="checkout.html">Checkout</a>
        <a class="nav-link" href="https://discord.gg/mineorange" target="_blank" rel="noopener">Discord</a>
      </div>

      <!-- Right Actions -->
      <div class="justify-self-end flex items-center gap-2 sm:gap-3">
        <button type="button" class="theme-toggle" onclick="window.toggleTheme()" aria-label="Toggle theme">
          <svg class="icon-sun" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="icon-moon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <a href="store.html" class="btn btn-outline text-xs px-3 sm:px-4">
          &larr; Return to Store
        </a>
      </div>
    </div>
  </nav>

  <!-- ==================== CHECKOUT BODY ==================== -->
  <main class="max-w-6xl mx-auto px-4 py-8 sm:py-12">
    <div class="mb-6">
      <div class="text-[11px] uppercase tracking-[.25em] text-white/40 font-mono">Store Checkout</div>
      <h1 class="font-display font-bold text-2xl sm:text-3xl md:text-4xl mt-1">Finalize Your Order</h1>
      <p class="text-white/60 text-sm mt-1">Enter your in-game identity to receive your items automatically upon payment.</p>
    </div>

    <!-- Empty cart warning (if not buying single item) -->
    <template x-if="items.length === 0">
      <div class="card p-8 sm:p-12 text-center max-w-xl mx-auto my-8">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center text-white/40 mb-4">
          <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
        </div>
        <h2 class="font-display font-bold text-xl">Your cart is currently empty</h2>
        <p class="text-white/60 text-sm mt-2 mb-6">Choose items or ranks from the store to continue to checkout.</p>
        <a href="store.html" class="btn btn-accent px-6 py-2.5">Browse Store Products</a>
      </div>
    </template>

    <template x-if="items.length > 0">
      <div class="grid lg:grid-cols-[1fr,380px] gap-6 items-start">
        
        <!-- ==================== LEFT COLUMN: PLAYER DETAILS & PAYMENT ==================== -->
        <div class="space-y-6">

          <!-- 1. Minecraft Player Identification Card -->
          <div class="card p-5 sm:p-6 space-y-4">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-lg bg-accent/15 border border-accent/30 text-accent font-bold text-sm flex items-center justify-center font-mono">
                1
              </div>
              <div>
                <h2 class="font-display font-semibold text-lg">Minecraft Account</h2>
                <p class="text-xs text-white/50">Your items will be granted to this Minecraft account.</p>
              </div>
            </div>

            <div class="grid sm:grid-cols-[1fr,auto] gap-4 items-center pt-2">
              <div>
                <label for="mc-username" class="block text-xs uppercase tracking-wider text-white/60 font-mono mb-1.5">
                  Minecraft Username
                </label>
                <div class="relative">
                  <input type="text" 
                         id="mc-username"
                         x-model="username" 
                         @input="updateAvatar()"
                         placeholder="e.g. Steve" 
                         class="w-full text-base font-mono pl-3 pr-10 py-2.5"
                         required>
                </div>
                <div class="flex items-center gap-2 mt-2">
                  <input type="checkbox" id="bedrock-player" x-model="isBedrock" @change="updateAvatar()" class="rounded border-white/20">
                  <label for="bedrock-player" class="text-xs text-white/60 cursor-pointer">I play on Minecraft Bedrock Edition (PE / Windows 10)</label>
                </div>
              </div>

              <!-- Live Player Avatar Preview -->
              <div class="flex flex-col items-center justify-center p-3 rounded-xl bg-black/30 border border-white/10 w-28 h-28 text-center">
                <img :src="avatarUrl" 
                     alt="Avatar Preview" 
                     class="w-14 h-14 rounded-lg object-contain image-render-pixel border border-white/10 shadow"
                     onerror="this.src='https://mc-heads.net/avatar/MHF_Steve/64';">
                <span class="text-[10px] text-white/50 font-mono truncate mt-1.5 w-full" x-text="username || 'Steve'"></span>
              </div>
            </div>
          </div>

          <!-- 2. Discord Link (Optional) -->
          <div class="card p-5 sm:p-6 space-y-3">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-lg bg-accent/15 border border-accent/30 text-accent font-bold text-sm flex items-center justify-center font-mono">
                2
              </div>
              <div>
                <h2 class="font-display font-semibold text-lg">Discord Integration (Optional)</h2>
                <p class="text-xs text-white/50">Receive automatic customer roles in our Discord community.</p>
              </div>
            </div>
            <div>
              <label for="discord-tag" class="block text-xs uppercase tracking-wider text-white/60 font-mono mb-1.5">Discord Username or ID</label>
              <input type="text" id="discord-tag" x-model="discordTag" placeholder="e.g. username#0000 or username" class="w-full font-mono text-sm py-2">
            </div>
          </div>

          <!-- 3. Payment Method Selection -->
          <div class="card p-5 sm:p-6 space-y-4">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-lg bg-accent/15 border border-accent/30 text-accent font-bold text-sm flex items-center justify-center font-mono">
                3
              </div>
              <div>
                <h2 class="font-display font-semibold text-lg">Payment Method</h2>
                <p class="text-xs text-white/50">Select your preferred payment gateway.</p>
              </div>
            </div>

            <div class="grid sm:grid-cols-3 gap-3 pt-1">
              <!-- Stripe Card -->
              <label class="p-3.5 rounded-xl border border-white/10 bg-white/5 hover:border-accent/40 cursor-pointer flex flex-col justify-between transition"
                     :class="{ 'border-accent bg-accent/10 ring-1 ring-accent': paymentMethod === 'stripe' }">
                <div class="flex items-center justify-between mb-2">
                  <span class="text-xs font-semibold">Credit / Debit Card</span>
                  <input type="radio" name="paymethod" value="stripe" x-model="paymentMethod" class="accent-red-500">
                </div>
                <div class="text-[11px] text-white/50">Visa, Mastercard, Amex, Apple Pay</div>
              </label>

              <!-- PayPal -->
              <label class="p-3.5 rounded-xl border border-white/10 bg-white/5 hover:border-accent/40 cursor-pointer flex flex-col justify-between transition"
                     :class="{ 'border-accent bg-accent/10 ring-1 ring-accent': paymentMethod === 'paypal' }">
                <div class="flex items-center justify-between mb-2">
                  <span class="text-xs font-semibold">PayPal</span>
                  <input type="radio" name="paymethod" value="paypal" x-model="paymentMethod" class="accent-red-500">
                </div>
                <div class="text-[11px] text-white/50">PayPal Balance & Linked Bank</div>
              </label>

              <!-- UPI / Indian Payments -->
              <label class="p-3.5 rounded-xl border border-white/10 bg-white/5 hover:border-accent/40 cursor-pointer flex flex-col justify-between transition"
                     :class="{ 'border-accent bg-accent/10 ring-1 ring-accent': paymentMethod === 'upi' }">
                <div class="flex items-center justify-between mb-2">
                  <span class="text-xs font-semibold">UPI / India QR</span>
                  <input type="radio" name="paymethod" value="upi" x-model="paymentMethod" class="accent-red-500">
                </div>
                <div class="text-[11px] text-white/50">GooglePay, PhonePe, Paytm, QR</div>
              </label>
            </div>
          </div>

          <!-- 4. Terms and Submit -->
          <div class="card p-5 sm:p-6 space-y-4">
            <div class="flex items-start gap-2.5">
              <input type="checkbox" id="terms-agree" x-model="agreedToTerms" class="mt-1 rounded border-white/20">
              <label for="terms-agree" class="text-xs text-white/70 leading-relaxed cursor-pointer">
                I agree to the <a href="terms.html" target="_blank" class="text-accent underline font-medium">Terms &amp; Conditions</a> and <a href="privacy.html" target="_blank" class="text-accent underline font-medium">Privacy Policy</a>. I understand that all Virtual Goods purchases are digital, immediate, and non-refundable.
              </label>
            </div>

            <button type="button" 
                    @click="processCheckout()" 
                    :disabled="!agreedToTerms || !username.trim()"
                    :class="{ 'opacity-50 cursor-not-allowed': !agreedToTerms || !username.trim() }"
                    class="btn btn-accent w-full py-3.5 text-base font-bold quick-buy shadow-xl">
              Pay <span class="font-mono ml-1" x-text="'$' + (finalTotalCents / 100).toFixed(2)"></span> &rarr;
            </button>
          </div>

        </div>

        <!-- ==================== RIGHT COLUMN: ORDER SUMMARY ==================== -->
        <aside class="space-y-4">
          <div class="card p-5 space-y-4">
            <h3 class="font-display font-semibold text-lg border-b border-white/10 pb-3">Order Summary</h3>

            <!-- Item list -->
            <div class="space-y-3 max-h-72 overflow-y-auto pr-1">
              <template x-for="item in items" :key="item.productId">
                <div class="flex items-center gap-3 p-2.5 rounded-lg bg-white/5 border border-white/5">
                  <img :src="item.imageUrl" :alt="item.name" class="w-12 h-12 object-contain bg-black/30 rounded p-1 border border-white/10">
                  <div class="min-w-0 flex-1">
                    <div class="font-medium text-xs truncate" x-text="item.name"></div>
                    <div class="text-[11px] text-white/50 font-mono">
                      <span x-text="item.quantity + 'x '"></span>
                      <span class="text-emerald-300" x-text="'$' + (item.unitPriceUsdCents / 100).toFixed(2)"></span>
                    </div>
                  </div>
                  <div class="text-xs font-mono font-semibold" x-text="'$' + ((item.quantity * item.unitPriceUsdCents) / 100).toFixed(2)"></div>
                </div>
              </template>
            </div>

            <!-- Coupon Code Form -->
            <div class="pt-2 border-t border-white/10">
              <label for="coupon-code" class="text-[11px] text-white/50 uppercase font-mono block mb-1">Coupon / Creator Code</label>
              <div class="flex gap-2">
                <input type="text" id="coupon-code" x-model="couponCode" placeholder="Enter code" class="font-mono text-xs uppercase flex-1 py-1.5">
                <button type="button" @click="applyCoupon()" class="btn btn-outline text-xs px-3">Apply</button>
              </div>
              <div x-show="discountPercent > 0" class="text-xs text-emerald-400 mt-1.5 font-mono">
                &check; Code applied: <span x-text="discountPercent + '% OFF'"></span>
              </div>
            </div>

            <!-- Price Breakdown -->
            <div class="space-y-2 pt-2 border-t border-white/10 text-xs">
              <div class="flex justify-between text-white/60">
                <span>Subtotal</span>
                <span class="font-mono" x-text="'$' + (subtotalCents / 100).toFixed(2)"></span>
              </div>
              <div x-show="discountPercent > 0" class="flex justify-between text-emerald-400">
                <span>Discount (<span x-text="discountPercent + '%'"></span>)</span>
                <span class="font-mono" x-text="'-$' + (discountCents / 100).toFixed(2)"></span>
              </div>
              <div class="flex justify-between text-white/60">
                <span>Taxes &amp; Gateway Fees</span>
                <span class="font-mono">$0.00</span>
              </div>
              <div class="flex justify-between text-base font-bold text-white pt-2 border-t border-white/10">
                <span>Total Due</span>
                <span class="font-mono text-emerald-400" x-text="'$' + (finalTotalCents / 100).toFixed(2)"></span>
              </div>
            </div>
          </div>

          <!-- Trust & Security Badges -->
          <div class="card p-4 text-xs text-white/50 space-y-2 border-white/5">
            <div class="flex items-center gap-2 text-white/70 font-semibold">
              <svg class="w-4 h-4 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
              </svg>
              <span>Instant Server Delivery</span>
            </div>
            <p>Your ranks and coins are injected into the server database right when the transaction is validated.</p>
          </div>
        </aside>

      </div>
    </template>
  </main>

  <!-- ==================== FOOTER ==================== -->
  <footer class="mt-16 sm:mt-24 border-t border-white/5 py-8 md:py-12 text-sm text-white/50">
    <div class="max-w-6xl mx-auto px-4 flex flex-col items-center justify-center gap-3 text-center">
      <div class="text-white/70 font-medium">&copy; 2026 Mine Orange Network. All rights reserved.</div>
      <div class="flex items-center gap-3 text-xs sm:text-sm">
        <a href="terms.html" class="hover:text-white transition">Terms &amp; Conditions</a>
        <span class="text-white/35">&middot;</span>
        <a href="privacy.html" class="hover:text-white transition">Privacy Policy</a>
        <span class="text-white/35">&middot;</span>
        <a href="store.html" class="hover:text-white transition">Web Store</a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/store-data.js"></script>
  <script src="js/app.js"></script>
  <script>
    function checkoutPage() {
      return {
        username: 'Steve',
        isBedrock: false,
        avatarUrl: 'https://mc-heads.net/avatar/Steve/64',
        discordTag: '',
        paymentMethod: 'stripe',
        agreedToTerms: false,
        couponCode: '',
        discountPercent: 0,
        items: [],

        init() {
          const params = new URLSearchParams(window.location.search);
          const buySlug = params.get('buy');

          if (buySlug) {
            const prod = (window.BATTLEPIE_DATA?.products || []).find(p => p.slug === buySlug || p.id === Number(buySlug));
            if (prod) {
              this.items = [{
                productId: prod.id,
                slug: prod.slug,
                name: prod.name,
                imageUrl: prod.imageUrl,
                unitPriceUsdCents: prod.priceUsdCents,
                quantity: 1,
                isSubscription: prod.isSubscription
              }];
            }
          }

          if (this.items.length === 0) {
            try {
              const saved = localStorage.getItem('zl-cart');
              if (saved) {
                const parsed = JSON.parse(saved);
                if (parsed && Array.isArray(parsed.lines) && parsed.lines.length > 0) {
                  this.items = parsed.lines;
                }
              }
            } catch (e) {}
          }

          // Check if user is logged in via Discord and pre-fill username
          fetch('/api/auth/me').then(r => r.json()).then(d => {
            if (d && d.authenticated && d.user) {
              this.username = d.user.username;
              this.updateAvatar();
            }
          }).catch(() => {});
        },

        updateAvatar() {
          let clean = this.username.trim();
          if (!clean) clean = 'Steve';
          if (this.isBedrock && !clean.startsWith('.') && !clean.startsWith('*')) {
            clean = '.' + clean;
          }
          this.avatarUrl = 'https://mc-heads.net/avatar/' + encodeURIComponent(clean) + '/64';
        },

        applyCoupon() {
          const code = this.couponCode.trim().toUpperCase();
          if (code === 'BATTLEPIE' || code === 'PIE' || code === 'DISCORD10') {
            this.discountPercent = 10;
            window.zlToast('10% Discount Applied!');
          } else if (code === 'VIP20') {
            this.discountPercent = 20;
            window.zlToast('20% Discount Applied!');
          } else {
            window.zlToast('Invalid promo code');
          }
        },

        get subtotalCents() {
          return this.items.reduce((sum, item) => sum + (item.quantity * item.unitPriceUsdCents), 0);
        },

        get discountCents() {
          return Math.round(this.subtotalCents * (this.discountPercent / 100));
        },

        get finalTotalCents() {
          return Math.max(0, this.subtotalCents - this.discountCents);
        },

        processCheckout() {
          if (!this.username.trim()) {
            window.zlToast('Please provide your Minecraft username');
            return;
          }
          if (!this.agreedToTerms) {
            window.zlToast('Please agree to the Terms & Conditions');
            return;
          }

          window.zlToast('Order placed successfully! Redirecting...');
          setTimeout(() => {
            alert(`Thank you, ${this.username}! Your order of $${(this.finalTotalCents / 100).toFixed(2)} has been recorded and will be delivered to play.battlepie.net upon server sync.`);
            localStorage.removeItem('zl-cart');
            window.location.href = 'index.html';
          }, 1500);
        }
      };
    }
  </script>
</body>
</html>
