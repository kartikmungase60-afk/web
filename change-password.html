<!doctype html>
<html lang="en" class="dark h-full">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Password · Mine Orange Network</title>
  <meta name="description" content="Update your in-game login password for your Mine Orange cracked account.">
  <link rel="icon" href="uploads/logo.png?v=naruto">

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <script src="js/account-nav.js"></script>

  <style>
    body {
      background-color: #07080b;
      color: #f3f4f6;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .font-display { font-family: 'Outfit', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    [x-cloak] { display: none !important; }
  </style>
</head>

<body class="min-h-full flex flex-col bg-[#07080b] selection:bg-[#ff2e1f] selection:text-white antialiased" x-data="changePasswordPage()" x-init="init()">

  <!-- Top Navigation Bar -->
  <nav class="sticky top-0 z-40 w-full border-b border-white/5 bg-[#07080b]/90 backdrop-blur-xl" x-data="sharedAccountNav()" x-init="init()">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      
      <!-- Brand Logo -->
      <a href="index.html" class="flex items-center gap-2.5 font-display font-bold text-base sm:text-lg min-w-0">
        <img src="uploads/logo.png?v=naruto" alt="Mine Orange" class="w-8 h-8 object-contain">
        <span class="tracking-tight text-white">Mine Orange</span>
      </a>

      <!-- Center Desktop Nav Links -->
      <div class="hidden md:flex items-center gap-6 text-sm text-white/70">
        <a class="hover:text-white transition" href="index.html">Home</a>
        <a class="hover:text-white transition" href="store.html">Store</a>
        <a class="hover:text-white transition" href="https://discord.gg/mineorange" target="_blank" rel="noopener">Discord</a>
      </div>

      <!-- Right Navigation Actions -->
      <div class="flex items-center gap-3">
        <!-- Cart Icon -->
        <a href="checkout.html" class="w-9 h-9 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-center text-white/70 hover:text-white transition" title="Shopping Cart">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
          </svg>
        </a>

        <!-- User Dropdown Menu -->
        <div class="relative" @click.outside="open = false">
          <button type="button" @click="open = !open"
                  class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-white/90 text-sm font-medium transition cursor-pointer">
            <img :src="getAvatarUrl()" alt="Avatar" class="w-5 h-5 rounded-full object-cover">
            <span class="max-w-[120px] truncate" x-text="getHandle()">@kartik_xd1</span>
            <svg class="w-3.5 h-3.5 opacity-60 transition-transform duration-200" :class="{ 'rotate-180': open }" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>

          <!-- Dropdown Menu -->
          <div x-show="open" x-cloak
               class="dropdown-menu absolute right-0 mt-2 w-48 rounded-xl bg-[#0b0f18] border border-white/10 shadow-2xl py-1.5 z-50 text-sm">
            <a href="me.html" class="block px-4 py-2 hover:bg-white/5 text-white/90 hover:text-white transition">Profile</a>
            <a href="orders.html" class="block px-4 py-2 hover:bg-white/5 text-white/90 hover:text-white transition">Orders</a>
            <a href="applications.html" class="block px-4 py-2 hover:bg-white/5 text-white/90 hover:text-white transition">Applications</a>
            <a href="tournaments.html" class="block px-4 py-2 hover:bg-white/5 text-white/90 hover:text-white transition">Tournaments</a>
            <a href="change-skin.html" class="block px-4 py-2 hover:bg-white/5 text-white/90 hover:text-white transition">Change Skin</a>
            <a href="change-password.html" class="block px-4 py-2 bg-white/5 text-white font-medium transition">Change Password</a>
            <a href="login.html" @click.prevent="logout()" class="block px-4 py-2 hover:bg-rose-500/10 text-rose-400 hover:text-rose-300 font-medium transition border-t border-white/5">Logout</a>
          </div>
        </div>

        <!-- Mailbox Notification Icon -->
        <a href="mailbox.html" class="relative w-9 h-9 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-center text-white/60 hover:text-white transition" title="Mailbox">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
          <template x-if="mailboxCount > 0">
            <span class="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-[#ff2e1f] text-[10px] font-bold text-white flex items-center justify-center" x-text="mailboxCount"></span>
          </template>
        </a>

      </div>
    </div>
  </nav>

  <!-- Main Content Container (Matches Screenshot 224837) -->
  <main class="max-w-[560px] mx-auto px-4 py-8 sm:py-12 w-full flex-1">
    
    <!-- Back to Account -->
    <div class="mb-5">
      <a href="me.html" class="inline-flex items-center text-xs sm:text-sm font-medium text-white/70 hover:text-white transition">
        ← Back to account
      </a>
    </div>

    <!-- Player Card Header -->
    <div class="flex items-center gap-4 mb-6">
      <img :src="'https://mc-heads.net/avatar/' + encodeURIComponent(username) + '/64'"
           alt="Steve Head" class="w-14 h-14 rounded-2xl object-cover border border-white/10 shadow-lg bg-black/40">
      <div>
        <div class="text-[11px] font-mono uppercase tracking-[0.2em] text-[#838b99] font-medium mb-0.5">CHANGING PASSWORD FOR</div>
        <div class="font-display font-bold text-2xl text-white tracking-tight leading-tight" x-text="username">Kartikplayzz</div>
        <div class="inline-block mt-1 px-2.5 py-0.5 rounded-md bg-amber-500/10 border border-amber-500/20 text-[10px] font-bold tracking-wider uppercase text-amber-400">
          CRACKED ACCOUNT
        </div>
      </div>
    </div>

    <!-- Password Change Form Card -->
    <div class="rounded-2xl bg-[#0e1017] border border-[#1b1f2a] shadow-2xl p-6 sm:p-7">
      <form @submit.prevent="submitPasswordChange()" class="space-y-5">
        
        <!-- New Password Field -->
        <div>
          <label class="block text-[11px] font-mono uppercase tracking-wider text-[#838b99] font-semibold mb-2">NEW PASSWORD</label>
          <div class="relative">
            <input :type="showPassword ? 'text' : 'password'" x-model="newPassword" required minlength="6"
                   placeholder="min. 6 characters"
                   class="w-full px-4 py-3 rounded-xl bg-black/40 border border-white/10 text-white font-mono text-sm placeholder-white/20 focus:border-[#ff2e1f] focus:outline-none transition pr-16">
            <button type="button" @click="showPassword = !showPassword"
                    class="absolute right-3.5 top-1/2 -translate-y-1/2 text-xs font-semibold text-white/50 hover:text-white transition cursor-pointer">
              <span x-text="showPassword ? 'Hide' : 'Show'">Show</span>
            </button>
          </div>
        </div>

        <!-- Confirm New Password Field -->
        <div>
          <label class="block text-[11px] font-mono uppercase tracking-wider text-[#838b99] font-semibold mb-2">CONFIRM NEW PASSWORD</label>
          <input type="password" x-model="confirmPassword" required minlength="6"
                 class="w-full px-4 py-3 rounded-xl bg-black/40 border border-white/10 text-white font-mono text-sm placeholder-white/20 focus:border-[#ff2e1f] focus:outline-none transition">
        </div>

        <!-- Reason Field -->
        <div>
          <label class="block text-[11px] font-mono uppercase tracking-wider text-[#838b99] font-semibold mb-2">REASON</label>
          <textarea x-model="reason" rows="3"
                    placeholder="e.g. routine rotation, forgot password, shared device"
                    class="w-full px-4 py-3 rounded-xl bg-black/40 border border-white/10 text-white text-xs sm:text-sm placeholder-white/20 focus:border-[#ff2e1f] focus:outline-none transition"></textarea>
          <p class="text-[11px] text-[#8c92a2] mt-2">
            Logged for audit. Visible to admins if they review your account.
          </p>
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center gap-3 pt-2">
          <button type="submit" :disabled="submitting"
                  class="px-6 py-2.5 rounded-xl bg-[#ff2e1f] hover:bg-[#e02618] text-white font-semibold text-xs sm:text-sm transition shadow-lg shadow-[#ff2e1f]/20 cursor-pointer flex items-center gap-2">
            <template x-if="submitting">
              <div class="w-3.5 h-3.5 border-2 border-white/20 border-t-white rounded-full animate-spin"></div>
            </template>
            <span x-text="submitting ? 'Updating...' : 'Change password'">Change password</span>
          </button>

          <a href="me.html" class="px-5 py-2.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-white/80 hover:text-white font-medium text-xs sm:text-sm transition">
            Cancel
          </a>
        </div>

      </form>
    </div>

  </main>

  <!-- Footer -->
  <footer class="mt-auto border-t border-white/5 py-8 text-center text-xs text-white/40">
    <div class="mb-2">© 2026 Mine Orange</div>
    <div class="flex justify-center gap-4 text-white/60 mb-4">
      <a href="terms.html" class="hover:text-white transition">Terms</a>
      <span>·</span>
      <a href="privacy.html" class="hover:text-white transition">Privacy Policy</a>
    </div>
  </footer>

  <script>
    function changePasswordPage() {
      return {
        username: 'Kartikplayzz',
        newPassword: '',
        confirmPassword: '',
        reason: '',
        showPassword: false,
        submitting: false,

        init() {
          const storedPlayer = localStorage.getItem('mo_player');
          if (storedPlayer) {
            try {
              const p = JSON.parse(storedPlayer);
              if (p.minecraftUsername) this.username = p.minecraftUsername;
            } catch(e) {}
          }
        },

        submitPasswordChange() {
          if (!this.newPassword || this.newPassword.length < 6) {
            alert('Password must be at least 6 characters long.');
            return;
          }
          if (this.newPassword !== this.confirmPassword) {
            alert('New passwords do not match. Please verify.');
            return;
          }

          this.submitting = true;
          fetch('/api/auth/change-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: this.username,
              newPassword: this.newPassword,
              confirmPassword: this.confirmPassword,
              reason: this.reason
            })
          })
          .then(r => r.json())
          .then(d => {
            if (d && d.success) {
              alert(d.message || 'Password changed successfully!');
              window.location.href = 'me.html';
            } else {
              alert(d.error || 'Failed to change password');
            }
          })
          .catch(e => {
            alert('Error updating password: ' + e.message);
          })
          .finally(() => {
            this.submitting = false;
          });
        }
      };
    }
  </script>

</body>
</html>
