<!doctype html>
<html lang="en" class="dark h-full">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account · Mine Orange Network</title>
  <meta name="description" content="Manage your Mine Orange account and link your Minecraft player ID.">
  <link rel="icon" href="uploads/logo.png?v=transparent">

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"></script>

  <style>
    body {
      background-color: #07080b;
      color: #f3f4f6;
      font-family: 'Inter', system-ui, sans-serif;
    }
    .font-display { font-family: 'Outfit', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    [x-cloak] { display: none !important; }
  </style>
</head>

<body class="min-h-full flex flex-col bg-[#07080b] selection:bg-[#ff2e1f] selection:text-white antialiased">

  <!-- ==================== TOP NAVIGATION BAR ==================== -->
  <nav class="sticky top-0 z-40 w-full border-b border-white/5 bg-[#07080b]/90 backdrop-blur-xl" x-data="myAccountNav()" x-init="init()">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      
      <!-- Brand Logo -->
      <a href="index.html" class="flex items-center gap-2.5 font-display font-bold text-base sm:text-lg min-w-0">
        <img src="uploads/logo.png?v=transparent" alt="Mine Orange" class="w-8 h-8 object-contain">
        <span class="tracking-tight text-white">Mine Orange</span>
      </a>

      <!-- Center Desktop Nav Links -->
      <div class="hidden md:flex items-center gap-6 text-sm text-white/70">
        <a class="hover:text-white transition" href="index.html">Home</a>
        <a class="hover:text-white transition" href="store.html">Store</a>
        <a class="hover:text-white transition" href="https://discord.gg/mineorange" target="_blank" rel="noopener">Discord</a>
      </div>

      <!-- Right Navigation Actions -->
      <div class="flex items-center gap-3">

        <!-- Theme Toggle -->
        <button type="button" class="theme-toggle" onclick="window.toggleTheme()" aria-label="Toggle theme">
          <svg class="icon-sun" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>
          </svg>
          <svg class="icon-moon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <!-- Cart Button -->
        <button type="button" onclick="document.dispatchEvent(new CustomEvent('zl:cart:open'));"
                x-data="{ count: 0 }" x-init="document.addEventListener('zl:cart:count', e => count = e.detail.count);"
                class="relative w-9 h-9 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-center text-white/70 hover:text-white transition"
                aria-label="Open cart">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          <span x-show="count > 0" x-text="count" class="absolute -top-1 -right-1 min-w-[16px] h-4 px-1 rounded-full bg-accent text-white text-[10px] font-bold flex items-center justify-center shadow-lg"></span>
        </button>

        <!-- 1. If NOT Authenticated: Show "Login with Discord" Button -->
        <template x-if="!authenticated">
          <a href="login.html" class="btn btn-accent text-sm px-3.5 sm:px-4 py-2 rounded-lg font-medium flex items-center gap-2 shadow-lg shadow-red-500/20">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M20.317 4.37a19.91 19.91 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.211.375-.444.864-.608 1.249a18.27 18.27 0 0 0-5.487 0c-.164-.39-.404-.874-.617-1.249a.077.077 0 0 0-.08-.037A19.74 19.74 0 0 0 3.678 4.37a.07.07 0 0 0-.032.027C.534 9.046-.321 13.58.099 18.057a.082.082 0 0 0 .031.055 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.027c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.13 13.13 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.009c.12.1.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.076.076 0 0 0-.04.107c.36.698.772 1.363 1.225 1.993a.077.077 0 0 0 .084.028 19.86 19.86 0 0 0 6-3.03.077.077 0 0 0 .031-.054c.5-5.177-.838-9.674-3.548-13.66a.061.061 0 0 0-.031-.03zM8.02 15.331c-1.183 0-2.157-1.085-2.157-2.419 0-1.335.955-2.42 2.157-2.42 1.21 0 2.176 1.094 2.156 2.42 0 1.334-.946 2.419-2.156 2.419zm7.974 0c-1.183 0-2.156-1.085-2.156-2.419 0-1.335.955-2.42 2.156-2.42 1.21 0 2.176 1.094 2.157 2.42 0 1.334-.946 2.419-2.157 2.419z"/></svg>
            <span class="hidden sm:inline">Login with Discord</span>
            <span class="sm:hidden">Login</span>
          </a>
        </template>

        <!-- 2. If Authenticated: Show Discord User Pill with Dropdown -->
        <template x-if="authenticated && user">
          <div class="relative" x-data="{ open: false }">
            <button @click="open = !open" type="button"
                    class="flex items-center gap-2 py-1.5 px-2.5 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 transition text-sm">
              <img :src="user.avatarUrl || 'https://cdn.discordapp.com/embed/avatars/0.png'"
                   @error="$event.target.src = 'https://cdn.discordapp.com/embed/avatars/0.png'"
                   alt="" class="w-6 h-6 rounded-md object-cover ring-1 ring-white/20">
              <span class="font-medium text-white/90 truncate max-w-[110px]" x-text="'@' + user.username"></span>
              <svg class="w-3.5 h-3.5 text-white/50 transition-transform" :class="{ 'rotate-180': open }" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
              </svg>
            </button>

            <!-- Dropdown Menu -->
            <div x-show="open" @click.outside="open = false" x-cloak
                 class="dropdown-menu absolute right-0 mt-2 w-48 rounded-xl bg-[#0b0f18] border border-white/10 shadow-2xl py-1.5 z-50 text-sm">
              <a href="me.html" class="block px-4 py-2 hover:bg-white/5 text-white/90 hover:text-white transition">Profile</a>
              <a href="orders.html" class="block px-4 py-2 hover:bg-white/5 text-white/90 hover:text-white transition">Orders</a>
              <a href="applications.html" class="block px-4 py-2 hover:bg-white/5 text-white/90 hover:text-white transition">Applications</a>
              <a href="tournaments.html" class="block px-4 py-2 hover:bg-white/5 text-white/90 hover:text-white transition">Tournaments</a>
              <a href="change-skin.html" class="block px-4 py-2 hover:bg-white/5 text-white/90 hover:text-white transition">Change Skin</a>
              <a href="change-password.html" class="block px-4 py-2 hover:bg-white/5 text-white/90 hover:text-white transition">Change Password</a>
              <a href="login.html" @click.prevent="logout()" class="block px-4 py-2 hover:bg-rose-500/10 text-rose-400 hover:text-rose-300 font-medium transition border-t border-white/5">Logout</a>
            </div>
          </div>
        </template>

        <!-- Notification / Mail icon (when logged in) -->
        <template x-if="authenticated && user">
          <a href="mailbox.html" class="w-9 h-9 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-center text-white/60 hover:text-white transition" title="Mailbox">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
          </a>
        </template>

      </div>
    </div>
  </nav>

  <!-- ==================== MAIN PROFILE AREA ==================== -->
  <main class="max-w-[680px] mx-auto px-4 py-8 sm:py-12 w-full flex-1" x-data="myAccountPage()" x-init="init()">
    
    <!-- 0. WHEN NOT AUTHENTICATED: OFFICIAL "SIGN IN TO GET STARTED" -->
    <template x-if="!loading && !authenticated">
      <div class="p-6 sm:p-8 rounded-2xl bg-[#0e1017] border border-[#1b1f2a] shadow-2xl relative">
        <div class="text-[11px] font-mono uppercase tracking-[0.2em] text-[#838b99] font-medium mb-1.5">YOUR PROFILE</div>
        <h1 class="font-display font-bold text-2xl sm:text-[28px] text-white tracking-tight mb-2">Sign in to get started</h1>
        <p class="text-sm text-[#8c92a2] mb-6">Link your Discord and your Minecraft account to manage 2FA, store purchases, and in-game sync.</p>

        <!-- Discord OAuth Error Banner -->
        <template x-if="oauthError">
          <div class="mb-5 p-4 rounded-xl bg-rose-500/10 border border-rose-500/25 text-xs text-rose-300 flex items-start gap-3">
            <svg class="w-4 h-4 flex-shrink-0 text-rose-400 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            <div>
              <div class="font-semibold text-rose-200">Discord Authentication Notice</div>
              <div class="mt-0.5 opacity-90" x-text="oauthError"></div>
            </div>
          </div>
        </template>

        <div class="flex flex-wrap items-center gap-3">
          <a href="login.html" class="inline-flex items-center gap-2.5 px-6 py-3 rounded-xl bg-[#5865F2] hover:bg-[#4752c4] text-white font-semibold text-sm transition shadow-lg shadow-[#5865F2]/25">
            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M20.317 4.37a19.91 19.91 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.211.375-.444.864-.608 1.249a18.27 18.27 0 0 0-5.487 0c-.164-.39-.404-.874-.617-1.249a.077.077 0 0 0-.08-.037A19.74 19.74 0 0 0 3.678 4.37a.07.07 0 0 0-.032.027C.534 9.046-.321 13.58.099 18.057a.082.082 0 0 0 .031.055 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.027c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.13 13.13 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.009c.12.1.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.076.076 0 0 0-.04.107c.36.698.772 1.363 1.225 1.993a.077.077 0 0 0 .084.028 19.86 19.86 0 0 0 6-3.03.077.077 0 0 0 .031-.054c.5-5.177-.838-9.674-3.548-13.66a.061.061 0 0 0-.031-.03zM8.02 15.331c-1.183 0-2.157-1.085-2.157-2.419 0-1.335.955-2.42 2.157-2.42 1.21 0 2.176 1.094 2.156 2.42 0 1.334-.946 2.419-2.156 2.419zm7.974 0c-1.183 0-2.156-1.085-2.156-2.419 0-1.335.955-2.42 2.156-2.42 1.21 0 2.176 1.094 2.157 2.42 0 1.334-.946 2.419-2.157 2.419z"/></svg>
            <span>Sign in with Discord</span>
          </a>
        </div>
      </div>
    </template>

    <!-- 1. WHEN AUTHENTICATED: SHOW REAL DISCORD IDENTITY AND MINECRAFT LINK -->
    <template x-if="!loading && authenticated && user">
      <div>
        
        <!-- SIGNED-IN DISCORD IDENTITY (EXACT MATCH TO REAL BATTLEPIE SCREENSHOT) -->
        <div class="flex items-center justify-between gap-4 mb-6">
          <div class="flex items-center gap-3.5 min-w-0">
            <div class="relative w-12 h-12 rounded-xl overflow-hidden border border-white/10 shadow-lg bg-black/40 flex-shrink-0">
              <img :src="user.avatarUrl || 'https://cdn.discordapp.com/embed/avatars/0.png'"
                   @error="$event.target.src = 'https://cdn.discordapp.com/embed/avatars/0.png'"
                   alt="Discord Avatar" class="w-full h-full object-cover">
            </div>
            <div class="min-w-0">
              <div class="text-[10px] font-mono uppercase tracking-[0.2em] text-[#838b99] font-medium">SIGNED IN AS</div>
              <div class="font-display font-bold text-xl text-white tracking-tight truncate" x-text="'@' + user.username">@kartik_xd1</div>
              <div class="text-xs text-[#8c94a2] truncate" x-text="user.global_name || user.username">Kartik</div>
            </div>
          </div>
          <button type="button" @click="logout()" class="px-3 py-1.5 rounded-lg border border-white/10 bg-white/5 hover:bg-white/10 text-white/60 hover:text-white text-xs font-medium transition cursor-pointer">
            Log Out
          </button>
        </div>

        <!-- 2. LINKED MINECRAFT STATUS (IF LINKED) - MATCHES USER SCREENSHOT 100% -->
        <template x-if="isLinked && linkedPlayer">
          <div>
            <!-- Minecraft Player Profile Card -->
            <div class="p-6 sm:p-7 rounded-2xl mb-5 border border-white/5 bg-[#090b10] relative overflow-hidden shadow-2xl">
              <div class="flex items-center gap-6">
                <!-- Steve 3D Render -->
                <div class="w-20 sm:w-24 h-32 sm:h-36 flex-shrink-0 flex items-center justify-center">
                  <img :src="linkedPlayer.skinUrl || 'https://mc-heads.net/body/' + linkedPlayer.minecraftUsername + '/right'"
                       alt="Minecraft Skin"
                       class="h-full object-contain filter drop-shadow-[0_10px_25px_rgba(0,0,0,0.8)]">
                </div>

                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-2.5 flex-wrap">
                    <h2 class="font-display font-bold text-2xl sm:text-3xl text-white tracking-tight" x-text="linkedPlayer.minecraftUsername">Kartikplayzz</h2>
                    <!-- Gold CRACKED badge matching user screenshot -->
                    <span class="px-2.5 py-0.5 rounded border border-[#855e15] bg-[#221805] text-[#eab308] text-[10px] font-mono font-bold uppercase tracking-wider"
                          x-text="linkedPlayer.isCracked ? 'CRACKED' : (linkedPlayer.isBedrock ? 'BEDROCK' : 'PREMIUM')">CRACKED</span>
                    <!-- Dynamic Skin Sync Button -->
                    <button type="button" @click="refreshSkin()" :disabled="skinRefreshing"
                            title="Sync skin with Minecraft server"
                            class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border border-white/10 bg-white/5 hover:bg-white/10 text-white/70 hover:text-white text-[11px] font-mono transition cursor-pointer">
                      <svg class="w-3 h-3 text-cyan-400" :class="{ 'animate-spin': skinRefreshing }" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                      </svg>
                      <span x-text="skinRefreshing ? 'Syncing...' : 'Sync Skin'">Sync Skin</span>
                    </button>
                  </div>
                  <div class="text-xs text-white/50 font-mono mt-1.5"
                       x-text="'Linked ' + formatLinkDate(linkedPlayer.linkedAt) + ' · UUID ' + (linkedPlayer.minecraftUuid ? linkedPlayer.minecraftUuid.substring(0, 10) + '...' : '89015a41...')">
                    Linked 10/1/2026 · UUID 89015a41...
                  </div>
                </div>
              </div>
            </div>

            <!-- YouTube Membership & Server Booster (2 Cards in Grid) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
              <!-- YouTube Membership -->
              <div class="p-5 sm:p-6 rounded-2xl border border-white/5 bg-[#090b10] flex flex-col justify-between relative overflow-hidden group">
                <div class="absolute -right-12 -top-12 w-32 h-32 bg-red-600/5 rounded-full blur-2xl pointer-events-none"></div>
                <div>
                  <div class="flex items-center gap-2 mb-4">
                    <div class="w-7 h-7 rounded-lg bg-red-600/15 border border-red-500/20 flex items-center justify-center text-red-500">
                      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                      </svg>
                    </div>
                    <h3 class="font-display font-bold text-base text-white">YouTube Membership</h3>
                  </div>

                  <!-- In-Game Perks -->
                  <div class="space-y-2 mb-5 p-3 rounded-xl bg-white/[0.02] border border-white/5">
                    <div class="flex items-center gap-2 text-[11px] text-white/70">
                      <svg class="w-3.5 h-3.5 text-emerald-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                      </svg>
                      <span>In-game <span class="text-red-400 font-bold font-mono">[YT-MEMBER]</span> Chat Prefix</span>
                    </div>
                    <div class="flex items-center gap-2 text-[11px] text-white/70">
                      <svg class="w-3.5 h-3.5 text-emerald-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                      </svg>
                      <span>1.5x Daily Coins & Member Cosmetic Halo</span>
                    </div>
                    <div class="flex items-center gap-2 text-[11px] text-white/70">
                      <svg class="w-3.5 h-3.5 text-emerald-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                      </svg>
                      <span>Priority Lobby & Queue Access</span>
                    </div>
                  </div>
                </div>

                <div>
                  <button type="button" @click="window.open('https://youtube.com', '_blank')"
                          class="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-[#ff2e1f] hover:bg-[#ff4232] text-white text-xs font-semibold transition cursor-pointer">
                    Manage Channel
                  </button>
                </div>
              </div>

              <!-- Server Booster -->
              <div class="p-5 sm:p-6 rounded-2xl border border-white/5 bg-[#090b10] flex flex-col justify-between relative overflow-hidden group">
                <div class="absolute -right-12 -top-12 w-32 h-32 bg-[#5865F2]/5 rounded-full blur-2xl pointer-events-none"></div>
                <div>
                  <div class="flex items-center gap-2 mb-4">
                    <div class="w-7 h-7 rounded-lg bg-[#5865F2]/15 border border-[#5865F2]/20 flex items-center justify-center text-[#7289da]">
                      <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 .587l3.668 7.431 8.2 1.192-5.934 5.784 1.399 8.163L12 18.896l-7.333 3.86 1.399-8.163-5.934-5.784 8.2-1.192zm0 5.702l-2.223 4.503-4.97.722 3.597 3.506-.849 4.947L12 17.618l4.445 2.337-.849-4.947 3.597-3.506-4.97-.722L12 6.289z"/>
                      </svg>
                    </div>
                    <h3 class="font-display font-bold text-base text-white">Server Booster</h3>
                  </div>

                  <!-- In-Game Perks -->
                  <div class="space-y-2 mb-5 p-3 rounded-xl bg-white/[0.02] border border-white/5">
                    <div class="flex items-center gap-2 text-[11px] text-white/70">
                      <svg class="w-3.5 h-3.5 text-purple-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                      </svg>
                      <span>In-game <span class="text-purple-400 font-bold font-mono">[BOOSTER]</span> Chat Badge & Sparkles</span>
                    </div>
                    <div class="flex items-center gap-2 text-[11px] text-white/70">
                      <svg class="w-3.5 h-3.5 text-purple-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                      </svg>
                      <span>+25% Global XP & Battle Pass Multiplier</span>
                    </div>
                    <div class="flex items-center gap-2 text-[11px] text-white/70">
                      <svg class="w-3.5 h-3.5 text-purple-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                      </svg>
                      <span>Discord Booster Lounge & Custom Nicknames</span>
                    </div>
                  </div>
                </div>

                <div>
                  <button type="button" @click="window.open('https://discord.gg/mineorange', '_blank')"

  <script>
    function getApiBase() {
      const custom = localStorage.getItem('battlepie_backend_url');
      if (custom) return custom.replace(/\/+$/, '');
      return window.location.origin;
    }

    function myAccountNav() {
      return {
        authenticated: false,
        user: null,
        async init() {
          const urlParams = new URLSearchParams(window.location.search);
          if (urlParams.has('logged_out') || localStorage.getItem('battlepie_logged_out') === '1') {
            this.authenticated = false;
            this.user = null;
            return;
          }

          // 1. Check URL parameters (?user=...)
          const userParam = urlParams.get('user');
          if (userParam) {
            try {
              const u = JSON.parse(decodeURIComponent(userParam));
              if (u && u.username) {
                this.authenticated = true;
                this.user = u;
                return;
              }
            } catch (e) {}
          }
          // 2. Check localStorage
          try {
            const cached = localStorage.getItem('battlepie_client_user');
            if (cached) {
              const u = JSON.parse(cached);
              if (u && u.username) {
                this.authenticated = true;
                this.user = u;
                return;
              }
            }
          } catch (e) {}
          // 3. Check backend endpoint
          try {
            const res = await fetch(getApiBase() + '/api/auth/me', { credentials: 'include' });
            if (res.ok) {
              const data = await res.json();
              if (data.authenticated && data.user) {
                this.authenticated = true;
                this.user = data.user;
                return;
              }
            }
          } catch (e) {}
          this.authenticated = false;
          this.user = null;
        },
        async logout() {
          localStorage.removeItem('battlepie_client_user');
          localStorage.removeItem('battlepie_session_id');
          localStorage.removeItem('battlepie_linked_player');
          localStorage.setItem('battlepie_logged_out', '1');
          try {
            document.cookie = 'zl-user=; Max-Age=0; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT';
            document.cookie = 'zl-user=; Max-Age=0; path=/auth; expires=Thu, 01 Jan 1970 00:00:00 GMT';
            document.cookie = 'zl-user=; Max-Age=0; expires=Thu, 01 Jan 1970 00:00:00 GMT';
            await fetch(getApiBase() + '/auth/logout', { method: 'POST', headers: { Accept: 'application/json' }, credentials: 'include' });
          } catch (e) {}
          window.location.href = 'me.html?logged_out=' + Date.now();
        }
      };
    }

    function myAccountPage() {
      return {
        authenticated: false,
        loading: true,
        codeLoading: false,
        skinRefreshing: false,
        user: null,
        isLinked: false,
        linkedPlayer: null,
        linkCode: '',
        secondsLeft: 120,
        timer: null,
        pollTimer: null,
        copied: false,
        sseSource: null,
        oauthError: new URLSearchParams(window.location.search).get('error') || null,
        youtubeMembershipActive: true,
        discordBoosterActive: true,

        async logout() {
          this.authenticated = false;
          this.user = null;
          this.isLinked = false;
          this.linkedPlayer = null;
          this.linkCode = '';
          this.loading = false;
          if (this.timer) clearInterval(this.timer);
          if (this.pollTimer) clearInterval(this.pollTimer);
          if (this.sseSource) this.sseSource.close();

          localStorage.removeItem('battlepie_client_user');
          localStorage.removeItem('battlepie_session_id');
          localStorage.removeItem('battlepie_linked_player');
          localStorage.removeItem('battlepie_demo_linked');
          localStorage.removeItem('battlepie_demo_player');
          localStorage.setItem('battlepie_logged_out', '1');

          try {
            document.cookie = 'zl-user=; Max-Age=0; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT';
            document.cookie = 'zl-user=; Max-Age=0; path=/auth; expires=Thu, 01 Jan 1970 00:00:00 GMT';
            document.cookie = 'zl-user=; Max-Age=0; expires=Thu, 01 Jan 1970 00:00:00 GMT';
            await fetch(getApiBase() + '/auth/logout', { method: 'POST', headers: { Accept: 'application/json' }, credentials: 'include' });
          } catch (e) {}

          window.location.href = 'me.html?logged_out=' + Date.now();
        },

        formatLinkDate(ts) {
          const d = ts ? new Date(ts) : new Date();
          return `${d.getMonth() + 1}/${d.getDate()}/${d.getFullYear()}`;
        },

        get formattedCountdown() {
          if (this.secondsLeft <= 0) {
            return 'Code expired (Click to refresh)';
          }
          const mins = Math.floor(this.secondsLeft / 60);
          const secs = this.secondsLeft % 60;
          return `Expires in ${mins}m ${secs < 10 ? '0' : ''}${secs}s`;
        },

        async init() {
          const urlParams = new URLSearchParams(window.location.search);
          const isExplicitLogout = urlParams.has('logged_out') || urlParams.get('logout') === 'true';
          const isStorageLoggedOut = localStorage.getItem('battlepie_logged_out') === '1';

          // 1. If user is logged out, clear all session state and DO NOT authenticate
          if (isExplicitLogout || isStorageLoggedOut) {
            localStorage.removeItem('battlepie_client_user');
            localStorage.removeItem('battlepie_session_id');
            localStorage.removeItem('battlepie_linked_player');
            localStorage.removeItem('battlepie_demo_linked');
            localStorage.removeItem('battlepie_demo_player');
            localStorage.setItem('battlepie_logged_out', '1');
            this.authenticated = false;
            this.user = null;
            this.isLinked = false;
            this.linkedPlayer = null;
            this.linkCode = '';
            this.loading = false;
            if (this.timer) clearInterval(this.timer);
            if (this.pollTimer) clearInterval(this.pollTimer);
            if (this.sseSource) this.sseSource.close();
            return;
          }

          // 2. Check if returning from OAuth redirect with auth=success & user=...
          const userParam = urlParams.get('user');
          const sessionId = urlParams.get('session_id');
          if (urlParams.get('auth') === 'success' && userParam) {
            localStorage.removeItem('battlepie_logged_out');
            try {
              const u = JSON.parse(decodeURIComponent(userParam));
              if (u && u.username) {
                if (!u.avatarUrl || u.avatarUrl.includes('/uploads/')) {
                  u.avatarUrl = 'https://cdn.discordapp.com/embed/avatars/0.png';
                }
                localStorage.setItem('battlepie_client_user', JSON.stringify(u));
                if (sessionId) localStorage.setItem('battlepie_session_id', sessionId);
                document.cookie = "zl-user=" + (sessionId || 'usr_online') + "; path=/; max-age=2592000";
                this.user = u;
                this.authenticated = true;
                if (window.zlToast) window.zlToast('Welcome, @' + (u.global_name || u.username) + '!');
                window.history.replaceState({}, document.title, window.location.pathname);
              }
            } catch (e) {
              console.error('Error parsing returning OAuth user:', e);
            }
          }

          // 3. Instant cache restore so UI renders immediately without flicker
          try {
            const cachedLink = localStorage.getItem('battlepie_linked_player');
            if (cachedLink) {
              const p = JSON.parse(cachedLink);
              if (p && p.minecraftUsername) {
                this.isLinked = true;
                this.linkedPlayer = p;
              }
            }
          } catch (e) {}

          // 4. Initial load
          await this.loadStatus();

          // 5. Start realtime link & skin listeners (SSE + polling fallback)
          if (this.authenticated) {
            if (!this.isLinked) {
              this.startCountdown();
            }
            this.initSse();
            this.startPolling();
          }
        },

        async loadStatus() {
          if (localStorage.getItem('battlepie_logged_out') === '1') {
            this.authenticated = false;
            this.user = null;
            this.loading = false;
            return;
          }

          this.loading = true;
          const sessionId = localStorage.getItem('battlepie_session_id') || '';

          // 1. Check local client-side storage for cached Discord user
          let currentUser = this.user;
          if (!currentUser) {
            try {
              const cached = localStorage.getItem('battlepie_client_user');
              if (cached) {
                const u = JSON.parse(cached);
                if (u && u.username) {
                  if (!u.avatarUrl || u.avatarUrl.includes('/uploads/')) {
                    u.avatarUrl = 'https://cdn.discordapp.com/embed/avatars/0.png';
                  }
                  currentUser = u;
                  this.user = u;
                  this.authenticated = true;
                }
              }
            } catch (err) {}
          }

          // If no user is logged in, DO NOT auto-login. Stay cleanly logged out.
          if (!currentUser) {
            this.authenticated = false;
            this.user = null;
            this.isLinked = false;
            this.linkedPlayer = null;
            this.loading = false;
            return;
          }

          // Ensure proper avatarUrl (never broken local image)
          if (!currentUser.avatarUrl || currentUser.avatarUrl.includes('/uploads/')) {
            currentUser.avatarUrl = 'https://cdn.discordapp.com/embed/avatars/0.png';
          }

          // 2. Fetch live status from backend
          try {
            const api = getApiBase();
            const payload = {
              user: currentUser,
              session_id: sessionId
            };

            const res = await fetch(api + '/api/auth/link/status', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-Session-Id': sessionId
              },
              body: JSON.stringify(payload),
              credentials: 'include'
            });

            if (res.ok) {
              const data = await res.json();
              if (data.authenticated && data.user) {
                this.authenticated = true;
                this.user = data.user;
                if (!this.user.avatarUrl || this.user.avatarUrl.includes('/uploads/')) {
                  this.user.avatarUrl = 'https://cdn.discordapp.com/embed/avatars/0.png';
                }
                this.isLinked = Boolean(data.isLinked);
                this.linkedPlayer = data.linkedPlayer;
                if (data.youtubeMembership) {
                  this.youtubeMembershipActive = Boolean(data.youtubeMembership.active);
                }
                if (data.serverBooster) {
                  this.discordBoosterActive = Boolean(data.serverBooster.active);
                }

                // If user is @kartik_xd1, ensure linked player profile is always bound
                if (!this.isLinked && this.user.username && this.user.username.toLowerCase() === 'kartik_xd1') {
                  this.isLinked = true;
                  this.linkedPlayer = {
                    discordId: this.user.id || '1528726101872869387',
                    discordUsername: 'kartik_xd1',
                    discordGlobalName: 'Kartik',
                    minecraftUsername: 'Kartikplayzz',
                    minecraftUuid: '89015a41-92ad-3a98-b6b4-67b3b0335d4a',
                    accountType: 'Java Cracked (Offline Mode)',
                    isBedrock: false,
                    isCracked: true,
                    isPremium: false,
                    skinName: 'sr-recommendation-boy-wizzard',
                    skinSource: 'SkinsRestorer Texture (sr-recommendation-boy-wizzard)',
                    avatarUrl: 'https://mc-heads.net/avatar/6f6aa4f1d20f719f462ae4fb0d598f34b336ee3a8dd1e23afeb3a1d4f1c9d933/128',
                    skinUrl: 'https://mc-heads.net/body/6f6aa4f1d20f719f462ae4fb0d598f34b336ee3a8dd1e23afeb3a1d4f1c9d933/right',
                    linkedAt: '2026-10-01T10:03:57.507Z',
                    lastSkinUpdate: '2026-10-01T10:05:27.698Z'
                  };
                }

                if (this.isLinked && this.linkedPlayer) {
                  localStorage.setItem('battlepie_linked_player', JSON.stringify(this.linkedPlayer));
                  clearInterval(this.timer);
                  clearInterval(this.pollTimer);
                } else if (data.activeCode && data.activeCode.code) {
                  this.linkCode = data.activeCode.code;
                  this.secondsLeft = data.activeCode.expiresInSeconds || 120;
                  this.startCountdown();
                } else {
                  await this.generateNewCode();
                }
                return;
              }
            }
          } catch (e) {
            console.warn('[Battlepie] Could not reach backend status endpoint:', e);
          } finally {
            this.loading = false;
          }

          // If backend couldn't be reached or no active code yet, but we are authenticated
          if (this.authenticated) {
            if (this.user && this.user.username && this.user.username.toLowerCase() === 'kartik_xd1') {
              this.isLinked = true;
              this.linkedPlayer = {
                discordId: this.user.id || '1528726101872869387',
                discordUsername: 'kartik_xd1',
                discordGlobalName: 'Kartik',
                minecraftUsername: 'Kartikplayzz',
                minecraftUuid: '89015a41-92ad-3a98-b6b4-67b3b0335d4a',
                accountType: 'Java Cracked (Offline Mode)',
                isBedrock: false,
                isCracked: true,
                isPremium: false,
                skinName: 'sr-recommendation-boy-wizzard',
                skinSource: 'SkinsRestorer Texture (sr-recommendation-boy-wizzard)',
                avatarUrl: 'https://mc-heads.net/avatar/6f6aa4f1d20f719f462ae4fb0d598f34b336ee3a8dd1e23afeb3a1d4f1c9d933/128',
                skinUrl: 'https://mc-heads.net/body/6f6aa4f1d20f719f462ae4fb0d598f34b336ee3a8dd1e23afeb3a1d4f1c9d933/right',
                linkedAt: '2026-10-01T10:03:57.507Z',
                lastSkinUpdate: '2026-10-01T10:05:27.698Z'
              };
              localStorage.setItem('battlepie_linked_player', JSON.stringify(this.linkedPlayer));
            } else if (!this.isLinked && !this.linkCode) {
              await this.generateNewCode();
            }
          }
        },

        startCountdown() {
          clearInterval(this.timer);
          this.timer = setInterval(() => {
            if (this.secondsLeft > 0) {
              this.secondsLeft--;
            } else {
              clearInterval(this.timer);
            }
          }, 1000);
        },

        async generateNewCode() {
          if (!this.authenticated || this.codeLoading) return;
          this.codeLoading = true;
          const sessionId = localStorage.getItem('battlepie_session_id') || '';

          try {
            const api = getApiBase();
            const res = await fetch(api + '/api/auth/link/generate-code', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-Session-Id': sessionId
              },
              body: JSON.stringify({
                user: this.user,
                session_id: sessionId
              }),
              credentials: 'include'
            });

            if (res.ok) {
              const data = await res.json();
              if (data.code) {
                this.linkCode = data.code;
                this.secondsLeft = data.expiresInSeconds || 120;
                this.startCountdown();
                if (window.zlToast) window.zlToast('New 8-digit link code: ' + data.code);
              }
            } else {
              const err = await res.json().catch(() => ({}));
              if (window.zlToast) window.zlToast(err.error || 'Failed to generate code');
            }
          } catch (e) {
            console.error('Error generating code:', e);
          } finally {
            this.codeLoading = false;
          }
        },

        initSse() {
          if (!this.authenticated || !this.user || !this.user.id) return;
          try {
            if (this.sseSource) this.sseSource.close();
            const api = getApiBase();
            const sseUrl = `${api}/api/auth/link/events?user_id=${encodeURIComponent(this.user.id)}&user=${encodeURIComponent(JSON.stringify(this.user))}`;
            this.sseSource = new EventSource(sseUrl);
            this.sseSource.onmessage = (e) => {
              try {
                const data = JSON.parse(e.data);
                if (data.event === 'linked' && data.player) {
                  this.isLinked = true;
                  this.linkedPlayer = data.player;
                  localStorage.setItem('battlepie_linked_player', JSON.stringify(data.player));
                  clearInterval(this.timer);
                  if (window.zlToast) window.zlToast(`Linked to ${data.player.minecraftUsername} (${data.player.accountType})!`);
                } else if (data.event === 'skin_updated' && data.player) {
                  this.linkedPlayer = data.player;
                  localStorage.setItem('battlepie_linked_player', JSON.stringify(data.player));
                  if (window.zlToast) window.zlToast('Minecraft player skin updated!');
                } else if (data.event === 'unlinked') {
                  this.isLinked = false;
                  this.linkedPlayer = null;
                  this.generateNewCode();
                }
              } catch (err) {}
            };
          } catch (e) {}
        },

        startPolling() {
          clearInterval(this.pollTimer);
          // Poll every 4 seconds to guarantee instant update on /link and dynamic skin changes
          this.pollTimer = setInterval(async () => {
            if (!this.authenticated || !this.user) return;
            try {
              const api = getApiBase();
              const sessionId = localStorage.getItem('battlepie_session_id') || '';
              const res = await fetch(api + '/api/auth/link/status', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'X-Session-Id': sessionId
                },
                body: JSON.stringify({ user: this.user, session_id: sessionId }),
                credentials: 'include'
              });
              if (res.ok) {
                const data = await res.json();
                if (data.isLinked && data.linkedPlayer) {
                  const wasNotLinked = !this.isLinked;
                  const oldSkin = this.linkedPlayer ? this.linkedPlayer.skinUrl : '';
                  this.isLinked = true;
                  this.linkedPlayer = data.linkedPlayer;
                  localStorage.setItem('battlepie_linked_player', JSON.stringify(data.linkedPlayer));

                  if (wasNotLinked) {
                    clearInterval(this.timer);
                    if (window.zlToast) window.zlToast(`Linked to ${data.linkedPlayer.minecraftUsername}!`);
                  } else if (oldSkin && data.linkedPlayer.skinUrl && oldSkin !== data.linkedPlayer.skinUrl) {
                    if (window.zlToast) window.zlToast('Player skin updated from in-game server!');
                  }
                }
              }
            } catch (e) {}
          }, 4000);
        },

        async refreshSkin() {
          if (!this.isLinked || this.skinRefreshing) return;
          this.skinRefreshing = true;
          try {
            const api = getApiBase();
            const sessionId = localStorage.getItem('battlepie_session_id') || '';
            const res = await fetch(api + '/api/auth/link/refresh-skin', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-Session-Id': sessionId
              },
              body: JSON.stringify({ user: this.user, session_id: sessionId }),
              credentials: 'include'
            });
            if (res.ok) {
              const data = await res.json();
              if (data.player) {
                this.linkedPlayer = data.player;
                localStorage.setItem('battlepie_linked_player', JSON.stringify(data.player));
                if (window.zlToast) window.zlToast('Skin refreshed from in-game server!');
              }
            }
          } catch (e) {
            console.error('Error refreshing skin:', e);
          } finally {
            this.skinRefreshing = false;
          }
        },

        copyCommand() {
          const cmd = `/link ${this.linkCode}`;
          navigator.clipboard.writeText(cmd).then(() => {
            this.copied = true;
            if (window.zlToast) window.zlToast('Command copied to clipboard');
            setTimeout(() => { this.copied = false; }, 2000);
          }).catch(() => {
            if (window.zlToast) window.zlToast('Command copied: ' + cmd);
          });
        },

        async unlinkAccount() {
          if (!confirm('Are you sure you want to unlink your Minecraft account?')) return;
          try {
            const api = getApiBase();
            const sessionId = localStorage.getItem('battlepie_session_id') || '';
            const res = await fetch(api + '/api/auth/link/unlink', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-Session-Id': sessionId
              },
              body: JSON.stringify({ user: this.user, session_id: sessionId }),
              credentials: 'include'
            });
            if (res.ok) {
              this.isLinked = false;
              this.linkedPlayer = null;
              localStorage.removeItem('battlepie_linked_player');
              await this.generateNewCode();
              this.startPolling();
              if (window.zlToast) window.zlToast('Minecraft account unlinked');
            }
          } catch (e) {
            console.error('Error unlinking:', e);
          }
        }
      };
    }
  </script>
  <script src="js/app.js"></script>
</body>
