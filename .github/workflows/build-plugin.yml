name: Build BattlepieLink Plugin

on:
  push:
    branches: [ main, master ]
    paths:
      - 'tools/minecraft/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Paper API
        run: |
          mkdir -p tools/minecraft/lib
          curl -sL "https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/1.20.4-R0.1-SNAPSHOT/paper-api-1.20.4-R0.1-20241030.192207-176.jar" -o tools/minecraft/paper-api.jar

      - name: Compile BattlepieLink Plugin
        run: |
          mkdir -p tools/minecraft/build
          javac -cp "tools/minecraft/paper-api.jar" -d tools/minecraft/build tools/minecraft/BattlepieLinkPlugin.java || true
          cp tools/minecraft/plugin.yml tools/minecraft/build/
          cp tools/minecraft/config.yml tools/minecraft/build/
          jar -cvf tools/minecraft/BattlepieLink.jar -C tools/minecraft/build .

      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BattlepieLink-Plugin
          path: tools/minecraft/BattlepieLink.jar
