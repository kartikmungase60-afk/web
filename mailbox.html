<!doctype html>
<html lang="en" class="dark h-full">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mailbox · Mine Orange Network</title>
  <meta name="description" content="View and accept team invitations for Mine Orange tournaments.">
  <link rel="icon" href="uploads/logo.png?v=transparent">

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background-color: #07080b;
      color: #f3f4f6;

<body class="min-h-full flex flex-col bg-[#07080b] selection:bg-[#ff2e1f] selection:text-white antialiased">

  <!-- Top Navigation Bar -->

      <a href="index.html" class="flex items-center gap-2.5 font-display font-bold text-base sm:text-lg min-w-0">
        <img src="uploads/logo.png?v=transparent" alt="Mine Orange" class="w-8 h-8 object-contain">
        <span class="tracking-tight text-white">Mine Orange</span>
      </a>

      <!-- Center Desktop Nav Links -->
      <div class="hidden md:flex items-center gap-6 text-sm text-white/70">
        <a class="hover:text-white transition" href="index.html">Home</a>
        <a class="hover:text-white transition" href="store.html">Store</a>
        <a class="hover:text-white transition" href="https://discord.gg/mineorange" target="_blank" rel="noopener">Discord</a>
      </div>

      <!-- Right Navigation Actions -->
      <div class="flex items-center gap-3">
        <!-- Cart Icon -->
        <a href="checkout.html" class="w-9 h-9 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-center text-white/70 hover:text-white transition" title="Shopping Cart">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
          </svg>
        </a>

        <!-- User Dropdown Menu -->
        <div class="relative" @click.outside="open = false">
          <button type="button" @click="open = !open"
                  class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-white/90 text-sm font-medium transition cursor-pointer">
            <img :src="getAvatarUrl()" alt="Avatar" class="w-5 h-5 rounded-full object-cover">
            <span class="max-w-[120px] truncate" x-text="getHandle()">@kartik_xd1</span>
            <svg class="w-3.5 h-3.5 opacity-60 transition-transform duration-200" :class="{ 'rotate-180': open }" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
            </svg>
          </button>

          <!-- Dropdown Menu -->
          <div x-show="open" x-cloak
               class="dropdown-menu absolute right-0 mt-2 w-48 rounded-xl bg-[#0b0f18] border border-white/10 shadow-2xl py-1.5 z-50 text-sm">
            <a href="me.html" class="block px-4 py-2 hover:bg-white/5 text-white/90 hover:text-white transition">Profile</a>
            <a href="orders.html" class="block px-4 py-2 hover:bg-white/5 text-white/90 hover:text-white transition">Orders</a>
            <a href="applications.html" class="block px-4 py-2 hover:bg-white/5 text-white/90 hover:text-white transition">Applications</a>
            <a href="tournaments.html" class="block px-4 py-2 hover:bg-white/5 text-white/90 hover:text-white transition">Tournaments</a>
            <a href="change-skin.html" class="block px-4 py-2 hover:bg-white/5 text-white/90 hover:text-white transition">Change Skin</a>
            <a href="change-password.html" class="block px-4 py-2 hover:bg-white/5 text-white/90 hover:text-white transition">Change Password</a>
            <a href="admin.html" class="block px-4 py-2 hover:bg-sky-500/10 text-sky-400 hover:text-sky-300 font-medium transition border-t border-white/5">Admin Panel</a>
            <a href="login.html" @click.prevent="logout()" class="block px-4 py-2 hover:bg-rose-500/10 text-rose-400 hover:text-rose-300 font-medium transition border-t border-white/5">Logout</a>
          </div>
        </div>

        <!-- Mailbox Notification Icon -->
        <a href="mailbox.html" class="relative w-9 h-9 rounded-lg bg-white/10 border border-white/20 flex items-center justify-center text-white" title="Mailbox">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
          <template x-if="mailboxCount > 0">
            <span class="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-[#ff2e1f] text-[10px] font-bold text-white flex items-center justify-center" x-text="mailboxCount"></span>
          </template>
        </a>

      </div>
    </div>
  </nav>

  <!-- Main Content Container (Matches Screenshot 224812) -->
  <main class="max-w-[720px] mx-auto px-4 py-8 sm:py-12 w-full flex-1" x-data="mailboxPage()" x-init="init()">
    
    <!-- Back to Tournaments -->
    <div class="mb-4">
      <a href="tournaments.html" class="inline-flex items-center text-xs sm:text-sm font-medium text-white/70 hover:text-white transition">
        ← Tournaments
      </a>
    </div>

    <!-- Title and Subtitle -->
    <div class="mb-8">
      <h1 class="font-display font-bold text-3xl sm:text-4xl text-white tracking-tight mb-2">Mailbox</h1>
      <p class="text-sm text-[#8c92a2]">Accept to join a team. You can be on one team per tournament.</p>
    </div>

    <!-- Empty State: You're all caught up (Matches Screenshot 224812) -->
    <template x-if="invites.length === 0">
      <div class="p-6 sm:p-7 rounded-2xl bg-[#0e1017] border border-[#1b1f2a] shadow-xl">
        <h2 class="text-base font-bold text-white mb-2">You're all caught up</h2>
        <p class="text-xs sm:text-sm text-[#8c92a2]">Team invitations will appear here. The mailbox badge updates while you browse.</p>
      </div>
    </template>

    <!-- Invites List (When Player Has Invites) -->
    <template x-if="invites.length > 0">
      <div class="space-y-4">
        <template x-for="inv in invites" :key="inv.id">
          <div class="p-6 rounded-2xl bg-[#0e1017] border border-[#1b1f2a] shadow-xl flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <div class="text-xs font-mono uppercase tracking-wider text-[#ff2e1f] font-semibold mb-1" x-text="inv.tournamentName"></div>
              <h3 class="text-lg font-bold text-white mb-1">
                Invitation to join <span class="text-amber-400" x-text="inv.teamName"></span>
              </h3>
              <div class="flex items-center gap-2 text-xs text-white/60">
                <span>Invited by</span>
                <img :src="'https://mc-heads.net/avatar/' + encodeURIComponent(inv.invitedBy) + '/24'" class="w-4 h-4 rounded-full">
                <span class="font-semibold text-white" x-text="inv.invitedBy"></span>
              </div>
            </div>

            <div class="flex items-center gap-2.5">
              <button type="button" @click="respond(inv.id, 'decline')"
                      class="px-4 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-white/70 hover:text-white text-xs font-medium transition cursor-pointer">
                Decline
              </button>
              <button type="button" @click="respond(inv.id, 'accept')"
                      class="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold transition cursor-pointer shadow-lg shadow-emerald-600/20">
                Accept
              </button>
            </div>
          </div>
        </template>
      </div>
    </template>

  </main>

  <!-- Footer -->
  <footer class="mt-auto border-t border-white/5 py-8 text-center text-xs text-white/40">
    <div class="mb-2">© 2026 Mine Orange</div>
    <div class="flex justify-center gap-4 text-white/60 mb-4">
      <a href="terms.html" class="hover:text-white transition">Terms</a>
      <span>·</span>
      <a href="privacy.html" class="hover:text-white transition">Privacy Policy</a>
    </div>
    <div class="flex justify-center gap-3 text-white/50">
      <a href="https://discord.gg/mineorange" target="_blank" rel="noopener" class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center hover:text-white hover:bg-white/10 transition">
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M20.317 4.37a19.91 19.91 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.211.375-.444.864-.608 1.249a18.27 18.27 0 0 0-5.487 0c-.164-.39-.404-.874-.617-1.249a.077.077 0 0 0-.08-.037A19.74 19.74 0 0 0 3.678 4.37a.07.07 0 0 0-.032.027C.534 9.046-.321 13.58.099 18.057a.082.082 0 0 0 .031.055 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.027c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.13 13.13 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.009c.12.1.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.076.076 0 0 0-.04.107c.36.698.772 1.363 1.225 1.993a.077.077 0 0 0 .084.028 19.86 19.86 0 0 0 6-3.03.077.077 0 0 0 .031-.054c.5-5.177-.838-9.674-3.548-13.66a.061.061 0 0 0-.031-.03zM8.02 15.331c-1.183 0-2.157-1.085-2.157-2.419 0-1.335.955-2.42 2.157-2.42 1.21 0 2.176 1.094 2.156 2.42 0 1.334-.946 2.419-2.156 2.419zm7.974 0c-1.183 0-2.156-1.085-2.156-2.419 0-1.335.955-2.42 2.156-2.42 1.21 0 2.176 1.094 2.157 2.42 0 1.334-.946 2.419-2.157 2.419z"/></svg>
      </a>
      <a href="https://instagram.com" target="_blank" rel="noopener" class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center hover:text-white hover:bg-white/10 transition">
        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
      </a>
    </div>
  </footer>

  <script>
    function mailboxPage() {
      return {
        invites: [],

        init() {
          const storedPlayer = localStorage.getItem('mo_player');
          let username = 'Kartikplayzz';
          if (storedPlayer) {
            try {
              const p = JSON.parse(storedPlayer);
              if (p.minecraftUsername) username = p.minecraftUsername;
            } catch(e) {}
          }

          fetch(`/api/mailbox?username=${encodeURIComponent(username)}`)
            .then(r => r.json())
            .then(d => {
              if (d && d.invites) {
                this.invites = d.invites.filter(i => i.status === 'PENDING');
              }
            })
            .catch(() => {});
        },

        respond(inviteId, action) {
          fetch('/api/mailbox/respond', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ inviteId, action })
          })
          .then(r => r.json())
          .then(d => {
            if (d && d.success) {
              this.invites = this.invites.filter(i => i.id !== inviteId);
              alert(d.message);
            }
          })
          .catch(e => {
            alert('Action failed: ' + e.message);
          });
        }
      };
    }
  </script>

</body>
</html>
